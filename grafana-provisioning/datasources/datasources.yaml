# grafana-provisioning/datasources/datasources.yaml
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    orgId: 1
    url: http://prometheus-operated.observability:9090 # Внутренний адрес Prometheus
    isDefault: true
    editable: true
  - name: Tempo
    type: tempo
    access: proxy
    orgId: 1
    url: http://tempo.observability:3200 # Внутренний адрес Tempo
    editable: true