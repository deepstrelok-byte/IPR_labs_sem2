# ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
  - host: "app.lab6.local"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            # Направляем трафик на наш user-service
            name: user-service-svc
            port:
              number: 8000
